[package]
name = "ramqp-core"
version = "0.2.6"
edition = "2024"
description = "Role-agnostic AMQP 1.0 engine (codec, framing, session/link state machines) shared by the ramqp client and ramqp-broker."
license = "MIT"
repository = "https://github.com/ZerosAndOnesLLC/rAMQP"
keywords = ["amqp", "amqp1", "messaging", "codec", "async"]
categories = ["network-programming", "asynchronous"]

# Document the feature-gated APIs (SCRAM / transactions) on docs.rs —
# not `scram-fips`: it needs CMake + Go to build and exposes the same API.
[package.metadata.docs.rs]
features = ["scram", "transaction"]

[dependencies]
bytes = "1"
thiserror = "2"
ordered-float = "5"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "io-util", "time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[features]
default = []
# SASL SCRAM primitives (hash math + string preparation), shared by the
# client's ScramClient and the broker's ScramServer.
scram = ["dep:hmac", "dep:sha1", "dep:sha2", "dep:pbkdf2", "dep:base64", "dep:stringprep"]
# The same SCRAM primitives on AWS-LC's FIPS 140-3 validated module
# (aws-lc-rs `fips`) instead of the RustCrypto crates — enable this INSTEAD
# of `scram` for a FIPS build (it wins when both are on). Building it needs
# CMake and Go (aws-lc-fips-sys).
scram-fips = ["dep:aws-lc-rs", "dep:base64", "dep:stringprep"]
# Transaction wire types (clean-room, spec part 4).
transaction = []

[dependencies.hmac]
version = "0.13"
optional = true

[dependencies.sha1]
version = "0.11"
optional = true

[dependencies.sha2]
version = "0.11"
optional = true

[dependencies.pbkdf2]
version = "0.13"
optional = true
default-features = false
features = ["hmac"]

[dependencies.base64]
version = "0.23"
optional = true

[dependencies.aws-lc-rs]
version = "1.19"
optional = true
default-features = false
features = ["fips", "alloc"]

[dependencies.stringprep]
version = "0.1"
optional = true
