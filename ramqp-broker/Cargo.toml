[package]
name = "ramqp-broker"
version = "0.12.1"
edition = "2024"
description = "A performance-first, highly-available AMQP 1.0 broker in Rust: transient, durable, and Raft-replicated quorum queues."
license = "MIT"
repository = "https://github.com/ZerosAndOnesLLC/rAMQP"
readme = "README.md"
keywords = ["amqp", "amqp1", "broker", "messaging", "async"]
categories = ["network-programming", "asynchronous"]

# The integration tests drive the broker with the `ramqp` client, a path-only
# dev-dependency that packaging strips — so inside the published .crate they
# could never compile. Keep them out of the package (they live in the repo).
exclude = ["tests"]

[package.metadata.docs.rs]
# Document everything except `fips`: its AWS-LC FIPS module needs CMake and
# Go, and it adds no API beyond `tls` (same items, different provider).
features = ["store-redb", "tls"]

[dependencies]
# SCRAM's crypto backend is chosen by this crate's `rustcrypto` (default) or
# `fips` feature.
ramqp-core = { path = "../ramqp-core", version = "0.2.8", features = ["transaction"] }
bytes = { version = "1", features = ["serde"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "io-util", "net", "rt", "rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
openraft = { version = "0.9.25", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23"
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }
redb = { version = "4", optional = true }
# The daemon's global allocator (wired up in the `ramqp-brokerd` bin). glibc's
# malloc fragments under high connection churn (issue #23); jemalloc keeps RSS
# and throughput flat.
tikv-jemallocator = { version = "0.7", optional = true }
# Server TLS (features `tls` — ring — or `fips` — AWS-LC FIPS 140-3).
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["tls12", "logging"] }
# Fabric peer identity: a peer's certificate must name one of the seed hosts.
webpki = { package = "rustls-webpki", version = "0.103", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
# The published client, used as the interop peer for loopback tests.
ramqp = { path = "../ramqp", features = ["transaction", "scram", "rustls"] }
tempfile = "3.27.0"
# Test-time certificate authority for the TLS tests.
rcgen = "0.14"
tokio = { version = "1", features = ["full", "test-util"] }

[features]
# jemalloc is the daemon's default global allocator: glibc's malloc fragments
# its per-thread arenas under high connection open/close churn, growing RSS
# without bound and collapsing throughput (issue #23) — jemalloc keeps both flat
# (measured: RSS +12% vs +64%, throughput -11% vs -76% over a 20-min churn
# soak). Disable with `--no-default-features` on targets jemalloc doesn't
# support.
default = ["jemalloc", "rustcrypto"]
jemalloc = ["dep:tikv-jemallocator"]
# SCRAM hashing on the RustCrypto crates (the default backend). A build needs
# this or `fips`.
rustcrypto = ["ramqp-core/scram"]
# Server TLS (AMQP + management listeners, cluster fabric mTLS) on rustls
# with the ring provider.
tls = ["dep:rustls", "dep:tokio-rustls", "dep:webpki", "rustls/ring", "tokio-rustls/ring"]
# FIPS build: TLS on rustls's AWS-LC FIPS 140-3 provider AND SCRAM hashing on
# AWS-LC FIPS — no other crypto backend. Build with
# `--no-default-features --features fips[,jemalloc,store-redb]`; needs
# CMake and Go. (With `tls`/`rustcrypto` also on, FIPS still wins.)
fips = ["dep:rustls", "dep:tokio-rustls", "dep:webpki", "rustls/fips", "tokio-rustls/fips", "ramqp-core/scram-fips"]
# Durable-local queues (`/durable/<name>`) backed by the redb embedded store.
store-redb = ["dep:redb"]
